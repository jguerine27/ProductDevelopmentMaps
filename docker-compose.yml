# Copy .env.example to .env and fill in values before running docker-compose up

services:
  neo4j:
    image: neo4j:5.19-community
    container_name: pdm-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache__size: 1G
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/plugins:/plugins
    ports:
      - 127.0.0.1:7474:7474
      - 127.0.0.1:7687:7687
    networks:
      - pdm-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pdm-backend
    restart: unless-stopped
    depends_on:
      - neo4j
    environment:
      NODE_ENV: production
      PORT: 4000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # Replaces the old wide-open CORS. Set to the public origin of the site.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    # /api/health reports 503 when Neo4j is unreachable, so a backend that comes
    # up before the database is restarted rather than left serving errors.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pdm-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BACKEND: /api
    container_name: pdm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - 127.0.0.1:3000:80
    networks:
      - pdm-network

networks:
  pdm-network:
    driver: bridge
