# Serves the built SPA and proxies /api to the backend container.
#
# This is the CONTAINER's nginx, listening on plain 80 and published to
# 127.0.0.1:3000. TLS is terminated by the host's nginx/Caddy in front of it —
# see "TLS" in .env.example. The session cookie is Secure in production, so
# reaching this server directly over http will appear to work while sign-in
# silently fails.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Above express's own 1mb json limit, so an oversized body is rejected by
    # the API as JSON rather than by nginx as an HTML 413 the client cannot parse.
    client_max_body_size 2m;

    # CRA emits content-hashed filenames under /static/, so they can never go
    # stale and are safe to pin for a year.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached: it is the only unhashed file, and a cached
    # copy keeps serving the previous build's script tags after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The host proxy terminates TLS, so $scheme here is http. Pass the
        # original through if the front proxy sets it.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # No Upgrade/Connection headers: this API has no websocket routes, and
        # sending a literal `Connection: upgrade` on every request breaks
        # keepalive to the upstream.
    }
}
